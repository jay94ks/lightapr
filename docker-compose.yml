version: '3.8'

services:
  lightapr:
    image: jay94ks/lightapr:latest
    container_name: lightapr-server
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "1883:1883"   # Native TCP MQTT Control Plane
      - "8083:8083"   # WebSocket MQTT Control Plane
      - "8080:8080"   # HTTP Management / Discovery Plane
    environment:
      - CELL_ID=default_cell
      - ACCESS_KEY=lightapr_secret_key
      - MQTT_PORT=1883
      - WS_PORT=8083
      - HTTP_PORT=8080
      - WORKER_THREADS=0
      - LOG_FILE=/var/log/lightapr.log
      - STANDALONE=true
      # - CONFIG_FILE=/etc/lightapr/config.json  # optional: replaces the CLI args above with a JSON config file
